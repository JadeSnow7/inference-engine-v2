services:
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/data/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      ENABLE_LOCAL_RAG: "0"
      RAG_PROVIDER: ${RAG_PROVIDER:-disabled}
      DASHSCOPE_KNOWLEDGE_BASE_ID: ${DASHSCOPE_KNOWLEDGE_BASE_ID:-}
      DASHSCOPE_RAG_MODEL: ${DASHSCOPE_RAG_MODEL:-qwen-plus}
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
