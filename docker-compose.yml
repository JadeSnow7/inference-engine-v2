services:
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/data/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      ENABLE_LOCAL_RAG: "0"
      MODELSCOPE_EMBED_MODEL_PATH: ${MODELSCOPE_EMBED_MODEL_PATH:-/app/data/modelscope/BAAI/bge-small-zh-v1.5}
      EMBED_MODEL: ${EMBED_MODEL:-/app/data/modelscope/BAAI/bge-small-zh-v1.5}
      RAG_PROVIDER: ${RAG_PROVIDER:-disabled}
      DASHSCOPE_KNOWLEDGE_BASE_ID: ${DASHSCOPE_KNOWLEDGE_BASE_ID:-}
      DASHSCOPE_RAG_MODEL: ${DASHSCOPE_RAG_MODEL:-qwen3.6-plus}
      DASHSCOPE_APP_ID: ${DASHSCOPE_APP_ID:-b3102617f35a4ffbab5befabebdcacc4}
      ENABLE_BAILIAN_APP: ${ENABLE_BAILIAN_APP:-1}
      NO_PROXY: localhost,127.0.0.1,172.17.0.1,redis,backend,frontend,mirrors.aliyun.com,.aliyun.com,.aliyuncs.com
      no_proxy: localhost,127.0.0.1,172.17.0.1,redis,backend,frontend,mirrors.aliyun.com,.aliyun.com,.aliyuncs.com
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
